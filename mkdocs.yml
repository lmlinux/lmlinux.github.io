site_name: lmlinux 的技术手记
site_description: 记录架构、排障与工程实践
site_url: https://lmlinux.github.io/
repo_url: https://github.com/lmlinux/lmlinux.github.io
repo_name: lmlinux.github.io
edit_uri: edit/main/docs/

hooks:
  - hooks.py

theme:
  name: material
  language: zh
  favicon: favicon.svg
  palette:
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.top          # 回到顶部悬浮按钮
    - navigation.tracking     # 地址栏同步当前章节
    - navigation.sections     # 侧边栏按章节分组
    - navigation.expand       # 侧边栏默认全展开（RTD 风格）
    - navigation.path         # 面包屑
    - search.highlight        # 搜索词高亮
    - search.suggest          # 搜索建议
    - content.code.copy       # 代码块复制按钮
    - content.code.annotate   # 代码注解
    - content.action.edit     # 「编辑此页」铅笔按钮（RTD 标配）
    - content.action.view     # 「查看源码」按钮
    - toc.follow              # 右侧目录跟随滚动
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - git-revision-date-localized:
      locale: zh
      type: datetime
      enable_creation_date: true
      fallback_to_build_date: true
      enable_git_follow: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - md_in_html
  - def_list
  - footnotes
  - tables

nav:
  - Home: index.md
  - lmlinux: lmlinux/index.md
  - Artificial Intelligence:
      - 概览: ai/index.md
  - English:
      - Home: en/index.md
